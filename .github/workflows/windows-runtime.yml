name: Windows native runtime

on:
  workflow_dispatch:
  push:
    branches: ['test/windows-native-*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  native-runtime:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-native-runtime-${{ hashFiles('Cargo.lock') }}
      - name: Record native environment
        run: |
          [System.Environment]::OSVersion.VersionString
          rustc -vV
      - name: Compile library and examples
        run: cargo check --locked --lib --examples
      - name: Run native Local filesystem and public contracts
        run: >-
          cargo test --locked
          --test local_transfer_runtime
          --test test_local_overwrite_truncate
          --test test_local_positional_io
          --test test_local_write_flush
          --test test_transfer_concurrency
          --test transfer_public_api
          --test hdfs_native_contract
          -- --test-threads=1
