name: Release validation

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or tag to validate
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: terrasync-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: [self-hosted, linux, x64, terrasync-lab, data-mover-rs]
    environment: release
    timeout-minutes: 240
    env:
      RUN_ID: release-${{ github.run_id }}-${{ github.run_attempt }}
      LAB_SSH_KEY: /home/github-runner/.ssh/terrasync_lab
      LAB_HDFS_LOCATION: hdfs://hdfs%2Fterrasync-runner%40HDFS.LOCAL@10.131.9.30:9000/
      LAB_HDFS_ADMIN_USER: hdfs/terrasync-runner@HDFS.LOCAL
      LAB_HDFS_CONFIG_DIR: /var/lib/data-mover-lab/hadoop
      LAB_HDFS_KEYTAB: /var/lib/data-mover-lab/terrasync-runner.keytab
      LAB_HDFS_HA_LOCATION: hdfs://hdfs%2Fterrasync-runner%40HDFS.LOCAL@hdfs-ha/tmp/data-mover-release/release-${{ github.run_id }}-${{ github.run_attempt }}/hdfs/ha
      LAB_HDFS_MEMORY_LOCATION: hdfs://hdfs%2Fterrasync-runner%40HDFS.LOCAL@hdfs-ha/tmp/data-mover-release/release-${{ github.run_id }}-${{ github.run_attempt }}/hdfs/memory
      LAB_HDFS_HA_CONFIG_DIR: /var/lib/data-mover-lab/hadoop
      LAB_HDFS_HA_NAMENODE1_ID: nn1
      LAB_HDFS_HA_NAMENODE1_HOST: 10.131.9.30
      LAB_HDFS_HA_NAMENODE1_VMID: "301"
      LAB_HDFS_HA_NAMENODE1_NAME: hdfs-namenode
      LAB_HDFS_HA_NAMENODE1_SERVICE: hadoop-namenode.service
      LAB_HDFS_HA_NAMENODE2_ID: nn2
      LAB_HDFS_HA_NAMENODE2_HOST: 10.131.9.33
      LAB_HDFS_HA_NAMENODE2_VMID: "304"
      LAB_HDFS_HA_NAMENODE2_NAME: hdfs-namenode2
      LAB_HDFS_HA_NAMENODE2_SERVICE: hadoop-namenode.service
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: tests/lab/health-check.sh
      - run: tests/lab/prepare-run.sh "$RUN_ID"
      - run: flock --wait 10800 /tmp/terrasync-lab-tests.lock cargo test --workspace --locked --no-fail-fast
      - name: Rolling hdfs-native contract and real HDFS lab
        run: flock --wait 10800 /tmp/terrasync-lab-tests.lock python3 tests/hdfs_upstream_contract.py --nightly --run-id "$RUN_ID"
      - name: ArchitectureReady standard S3 contract
        run: flock --wait 10800 /tmp/terrasync-lab-tests.lock tests/lab/run-s3-architecture-contract.sh "$RUN_ID"
      - name: Storage matrix E2E (protocol defaults)
        run: flock --wait 10800 /tmp/terrasync-lab-tests.lock tests/lab/run-e2e.sh "$RUN_ID"
      - name: Storage matrix E2E (high transfer concurrency)
        env:
          DATA_MOVER_READ_INFLIGHT: "8"
          DATA_MOVER_WRITE_INFLIGHT: "16"
        run: flock --wait 10800 /tmp/terrasync-lab-tests.lock tests/lab/run-e2e.sh "$RUN_ID"
      - name: Independent integrity check E2E
        env:
          DATA_MOVER_READ_INFLIGHT: "8"
          DATA_MOVER_WRITE_INFLIGHT: "16"
        run: flock --wait 10800 /tmp/terrasync-lab-tests.lock tests/lab/run-integrity-e2e.sh "$RUN_ID"
      - name: Resumable copy E2E
        env:
          DATA_MOVER_READ_INFLIGHT: "8"
          DATA_MOVER_WRITE_INFLIGHT: "16"
        run: flock --wait 10800 /tmp/terrasync-lab-tests.lock tests/lab/run-resume-e2e.sh "$RUN_ID"
      - name: Real-backend strict bandwidth QoS E2E
        run: flock --wait 10800 /tmp/terrasync-lab-tests.lock tests/lab/run-qos-e2e.sh "$RUN_ID" qos-bandwidth-strict.csv
      - name: Real-backend soft and hard bandwidth QoS E2E
        env:
          QOS_LAB_SOFT_RATE_MIB: "8"
          QOS_LAB_HARD_RATE_MIB: "12"
          QOS_LAB_PEAK_DURATION_MS: "500"
        run: flock --wait 10800 /tmp/terrasync-lab-tests.lock tests/lab/run-qos-e2e.sh "$RUN_ID" qos-bandwidth-soft-hard.csv
      - name: Real-backend strict IOPS QoS E2E
        env:
          QOS_LAB_PROFILE: iops
        run: flock --wait 10800 /tmp/terrasync-lab-tests.lock tests/lab/run-qos-e2e.sh "$RUN_ID" qos-iops-strict.csv
      - name: Real-backend soft and hard IOPS QoS E2E
        env:
          QOS_LAB_PROFILE: iops
          QOS_LAB_IOPS_MODE: soft-hard
        run: flock --wait 10800 /tmp/terrasync-lab-tests.lock tests/lab/run-qos-e2e.sh "$RUN_ID" qos-iops-soft-hard.csv
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: qos-e2e-release-${{ github.run_id }}
          path: qos-*.csv
      - name: HDFS 1 GiB to 100 GiB bounded-memory gate
        run: flock --wait 10800 /tmp/terrasync-lab-tests.lock tests/lab/run-hdfs-memory-e2e.sh "$RUN_ID" hdfs-memory.csv
      - name: HDFS service fault recovery
        run: flock --wait 10800 /tmp/terrasync-lab-tests.lock tests/lab/run-hdfs-fault-e2e.sh "$RUN_ID" hdfs-fault.log
      - name: Conditional HDFS HA acceptance
        run: flock --wait 10800 /tmp/terrasync-lab-tests.lock tests/lab/run-hdfs-ha-e2e.sh "$RUN_ID"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: hdfs-fault-release-${{ github.run_id }}
          path: hdfs-fault.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: hdfs-memory-release-${{ github.run_id }}
          path: hdfs-memory.csv
      - run: cargo build --release --locked
      - run: cargo build --examples --release --locked
      - name: Record dependency revisions
        run: cargo metadata --locked --format-version 1 > dependency-metadata.json
      - uses: actions/upload-artifact@v6
        with:
          name: data-mover-release-validation-${{ github.run_id }}
          path: dependency-metadata.json
      - name: Cleanup
        if: always()
        run: tests/lab/cleanup-run.sh "$RUN_ID"
