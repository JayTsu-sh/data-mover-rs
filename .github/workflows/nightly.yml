name: Nightly lab

on:
  schedule:
    - cron: "20 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terrasync-lab
  cancel-in-progress: false

jobs:
  storage-contracts:
    runs-on: [self-hosted, linux, x64, terrasync-lab, data-mover-rs]
    timeout-minutes: 150
    env:
      RUN_ID: nightly-${{ github.run_id }}-${{ github.run_attempt }}
      TERRASYNC_NFS3_SOURCE: 10.10.1.12:/srv/nfs/v3
      TERRASYNC_NFS41_SOURCE: 10.10.1.12:/srv/nfs/v4
      TERRASYNC_NFS3_DEST: 10.10.1.13:/srv/nfs/v3
      TERRASYNC_NFS41_DEST: 10.10.1.13:/srv/nfs/v4
      TERRASYNC_S3_SOURCE: http://10.10.1.12:9000
      TERRASYNC_S3_DEST: http://10.10.1.13:9000
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: clippy
      - run: tests/lab/health-check.sh
      - run: tests/lab/prepare-run.sh "$RUN_ID"
      - run: flock --wait 10800 /tmp/terrasync-lab-tests.lock cargo test --workspace --no-fail-fast
      - run: cargo build --examples
      - name: cargo clippy (all targets, deny warnings)
        run: python3 .claude/skills/quality-clippy/scripts/run.py
      - name: Storage matrix E2E (protocol defaults)
        run: flock --wait 10800 /tmp/terrasync-lab-tests.lock tests/lab/run-e2e.sh "$RUN_ID"
      - name: Storage matrix E2E (serial transfer pipelines)
        env:
          DATA_MOVER_READ_INFLIGHT: "1"
          DATA_MOVER_WRITE_INFLIGHT: "1"
        run: flock --wait 10800 /tmp/terrasync-lab-tests.lock tests/lab/run-e2e.sh "$RUN_ID"
      - name: Storage matrix E2E (high transfer concurrency)
        env:
          DATA_MOVER_READ_INFLIGHT: "8"
          DATA_MOVER_WRITE_INFLIGHT: "16"
        run: flock --wait 10800 /tmp/terrasync-lab-tests.lock tests/lab/run-e2e.sh "$RUN_ID"
      - name: Independent integrity check E2E
        env:
          DATA_MOVER_READ_INFLIGHT: "8"
          DATA_MOVER_WRITE_INFLIGHT: "16"
        run: flock --wait 10800 /tmp/terrasync-lab-tests.lock tests/lab/run-integrity-e2e.sh "$RUN_ID"
      - name: Resumable copy E2E
        env:
          DATA_MOVER_READ_INFLIGHT: "8"
          DATA_MOVER_WRITE_INFLIGHT: "16"
        run: flock --wait 10800 /tmp/terrasync-lab-tests.lock tests/lab/run-resume-e2e.sh "$RUN_ID"
      - name: Inflight performance benchmark
        run: flock --wait 10800 /tmp/terrasync-lab-tests.lock tests/lab/run-inflight-benchmark.sh "$RUN_ID" inflight-benchmark.csv
      - name: Upload inflight benchmark
        uses: actions/upload-artifact@v6
        with:
          name: inflight-benchmark-${{ github.run_id }}
          path: inflight-benchmark.csv
      - name: Cleanup
        if: always()
        run: tests/lab/cleanup-run.sh "$RUN_ID"
