name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-hdfs-contract:
    name: windows HDFS Simple-mode compile contract
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (1.95.0)
        uses: dtolnay/rust-toolchain@1.95.0

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Compile library, HDFS contracts, and examples
        run: cargo check --locked --lib --test hdfs_native_contract --examples

  ci:
    name: fmt + clippy + test + examples + e2e-local
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (1.95.0)
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Install Python (for skill runners)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: Architecture dependency guard
        run: |
          python3 tests/validate_architecture_dependencies.py .
          python3 -m unittest tests/test_architecture_dependencies.py

      - name: cargo clippy (all targets, deny warnings)
        run: python3 .claude/skills/quality-clippy/scripts/run.py

      - name: cargo test
        run: cargo test --workspace --no-fail-fast

      - name: hdfs-native rolling contract
        run: python3 tests/hdfs_upstream_contract.py

      - name: HDFS directed matrix contract
        run: python3 tests/test_hdfs_directed_matrix.py

      - name: HDFS memory budget contract
        run: python3 tests/test_hdfs_memory_budget.py

      - name: HDFS fault harness safety contract
        run: python3 tests/test_hdfs_fault_harness.py

      - name: Conditional HDFS HA gate contract
        run: python3 tests/test_hdfs_ha_gate.py

      - name: cargo build --examples
        run: cargo build --examples

      - name: e2e-local skill
        run: python3 .claude/skills/e2e-local/scripts/run.py

      - name: audit large files
        run: python3 .claude/skills/quality-large-file-audit/scripts/run.py

      - name: audit dispatch coverage
        run: python3 .claude/skills/quality-dispatch-coverage/scripts/run.py
