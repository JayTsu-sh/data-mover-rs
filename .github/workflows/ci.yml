name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: fmt + clippy + test + examples + e2e-local
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain (1.95.0)
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Install Python (for skill runners)
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy (all targets, deny warnings)
        run: python3 .claude/skills/quality-clippy/scripts/run.py

      - name: cargo test
        run: cargo test --workspace --no-fail-fast

      - name: cargo build --examples
        run: cargo build --examples

      - name: e2e-local skill
        run: python3 .claude/skills/e2e-local/scripts/run.py

      - name: audit large files
        run: python3 .claude/skills/quality-large-file-audit/scripts/run.py

      - name: audit dispatch coverage
        run: python3 .claude/skills/quality-dispatch-coverage/scripts/run.py
