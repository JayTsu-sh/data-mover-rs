[package]
name = "data-mover-transfer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
data-mover-model = { path = "../model" }
data-mover-storage-core = { path = "../storage-core" }
data-mover-metadata = { path = "../metadata" }
async-trait = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true, features = ["serde"] }
futures = { workspace = true }
md-5 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tokio-util = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
tempfile = { workspace = true }

[dev-dependencies]
data-mover-acl = { path = "../acl" }
filetime = { workspace = true }
data-mover-test-support = { path = "../test-support" }
data-mover-traversal = { path = "../traversal" }
data-mover-storage-core = { path = "../storage-core", features = ["test-support"] }
data-mover-backend-local = { path = "../backend-local", features = ["test-support"] }
data-mover-backend-nfs = { path = "../backend-nfs", features = ["test-support"] }
data-mover-backend-cifs = { path = "../backend-cifs", features = ["test-support"] }
data-mover-backend-s3 = { path = "../backend-s3", features = ["test-support"] }
data-mover-backend-hdfs = { path = "../backend-hdfs", features = ["test-support"] }
data-mover-integrity = { path = "../integrity" }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(unix)'.dev-dependencies]
xattr = { workspace = true }
