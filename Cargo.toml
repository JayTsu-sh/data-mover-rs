[package]
name = "data-mover"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[workspace]
members = ["crates/*"]
default-members = ["."]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.95"

[features]
default = ["full"]
full = ["traversal", "transfer", "integrity", "metadata", "acl", "backend-local", "backend-nfs", "backend-cifs", "backend-s3", "backend-hdfs"]
acl = ["dep:data-mover-acl"]
metadata = ["dep:data-mover-metadata", "acl"]
transfer = ["dep:data-mover-transfer", "metadata"]
integrity = ["dep:data-mover-integrity", "acl"]
traversal = ["dep:data-mover-traversal"]
backend-local = ["dep:data-mover-backend-local"]
backend-nfs = ["dep:data-mover-backend-nfs", "acl", "dep:nfs-rs"]
backend-cifs = ["dep:data-mover-backend-cifs", "dep:smb-domain"]
backend-s3 = ["dep:data-mover-backend-s3", "dep:aws-config", "dep:aws-credential-types", "dep:aws-sdk-s3", "dep:aws-smithy-runtime-api", "dep:aws-smithy-types", "dep:aws-types"]
backend-hdfs = ["dep:data-mover-backend-hdfs", "dep:hdfs-native"]

[dependencies]
data-mover-model = { path = "crates/model" }
data-mover-storage-core = { path = "crates/storage-core" }
data-mover-acl = { path = "crates/acl", optional = true }
data-mover-metadata = { path = "crates/metadata", optional = true }
data-mover-integrity = { path = "crates/integrity", optional = true }
data-mover-traversal = { path = "crates/traversal", optional = true }
data-mover-transfer = { path = "crates/transfer", optional = true }
data-mover-backend-local = { path = "crates/backend-local", optional = true }
data-mover-backend-nfs = { path = "crates/backend-nfs", optional = true }
data-mover-backend-cifs = { path = "crates/backend-cifs", optional = true }
data-mover-backend-s3 = { path = "crates/backend-s3", optional = true }
data-mover-backend-hdfs = { path = "crates/backend-hdfs", optional = true }
aws-config = { workspace = true, optional = true }
aws-credential-types = { workspace = true, optional = true }
aws-sdk-s3 = { workspace = true, optional = true }
aws-smithy-runtime-api = { workspace = true, optional = true }
aws-smithy-types = { workspace = true, features = ["http-body-1-x"], optional = true }
aws-types = { workspace = true, optional = true }
hdfs-native = { workspace = true, optional = true }
nfs-rs = { workspace = true, optional = true }
smb-domain = { workspace = true, optional = true }

[dev-dependencies]
arc-swap = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
binrw = { workspace = true }
blake3 = { workspace = true }
bytes = { workspace = true, features = ["serde"] }
cap-std = { workspace = true }
cap-primitives = { workspace = true }
chrono = { workspace = true }
filetime = { workspace = true }
futures = { workspace = true }
glob = { workspace = true }
governor = { workspace = true }
http-body = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
percent-encoding = { workspace = true }
tracing = { workspace = true }
moka = { workspace = true, features = ["sync"] }
md-5 = { workspace = true }
num-traits = { workspace = true }
path-clean = { workspace = true }
quick-xml = { workspace = true, features = ["serialize"] }
hyper-rustls = { workspace = true, features = ["http1", "http2"] }
hyper-util = { workspace = true, features = ["client-legacy", "tokio"] }
rustls = { workspace = true, features = ["ring", "std"] }
serde = { workspace = true, features = ["derive", "rc"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
tokio-util = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
clap = { workspace = true, features = ["derive"] }
indicatif = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio-rustls = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[target.'cfg(unix)'.dev-dependencies]
libc = { workspace = true }
rustix = { workspace = true, features = ["process", "thread"] }
xattr = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
windows = { workspace = true, features = ["Win32", "Win32_Security", "Win32_Security_Authorization"] }
windows-sys = { workspace = true, features = ["Wdk_System_SystemServices", "Win32", "Win32_Security", "Win32_Security_Authorization", "Win32_Foundation", "Win32_System_SystemServices", "Win32_System_Memory", "Win32_Storage_FileSystem"] }

[profile.dev.package."*"]
debug = 0

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

